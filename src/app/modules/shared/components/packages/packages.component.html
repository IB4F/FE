<div class="pkg-wrap">

  <!-- Billing toggle -->
  <div class="rg-billing-toggle-wrap">
    <div class="rg-billing-toggle" [class.is-annual]="isAnnual">
      <div class="rg-billing-pill"></div>
      <button class="rg-billing-btn"
              type="button"
              [class.is-active]="!isAnnual"
              (click)="setBillingCycle('monthly')">
        {{ 'common.monthly' | translate }}
      </button>
      <button class="rg-billing-btn"
              type="button"
              [class.is-active]="isAnnual"
              (click)="setBillingCycle('annual')">
        {{ 'common.annual' | translate }}
      </button>
    </div>
  </div>

  <!-- Package cards -->
  <div class="rg-pkg-grid">
    <div class="rg-pkg-card"
         *ngFor="let card of currentCards"
         [class.is-popular]="card.isBestValue"
         [class.is-selected]="selectedCard === card"
         [class.is-dimmed]="selectedCard && selectedCard !== card"
         (click)="selectCard(card)">

      <span *ngIf="card.isBestValue" class="tag">{{ 'packages.bestValue' | translate }}</span>
      <div class="tier">{{ card.title }}</div>
      <div class="name">{{ card.title }}</div>
      <div class="desc">{{ card.description }}</div>

      <div class="price">
        <span class="cur">€</span>
        <span class="amt">{{ card.price }}</span>
        <span class="per">/{{ isAnnual ? 'vit' : 'muaj' }}</span>
      </div>

      <ul class="feats">
        <li *ngFor="let feature of card.features">
          <span class="ck">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
              <path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          {{ feature }}
        </li>
      </ul>

      <button class="cta" type="button">
        {{ selectedCard === card ? ('packages.selected' | translate) : ('packages.select' | translate) }}
      </button>

    </div>
  </div>

</div>
