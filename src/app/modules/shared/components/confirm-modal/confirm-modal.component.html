<div class="bg-confirm">

  <div class="bg-confirm__icon-wrap">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6M14 11v6"/>
      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    </svg>
  </div>

  <h2 class="bg-confirm__title">{{ data.title }}</h2>
  <p class="bg-confirm__msg">{{ data.message }}</p>

  <div class="bg-confirm__actions">
    <button class="bg-btn bg-btn--ghost" (click)="onCancel()">Anulo</button>
    <button class="bg-btn bg-btn--danger" (click)="onConfirm()">Fshi</button>
  </div>

</div>
