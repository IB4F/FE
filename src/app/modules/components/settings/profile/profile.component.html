<div class="panel">
  <div class="panel-head">
    <div class="profile-hero">
      <div class="avatar">{{ userInitials | uppercase }}</div>
      <div>
        <h2>{{ fullName }}</h2>
        <p>{{ 'settings.profile.subtitle' | translate }}</p>
      </div>
    </div>
    <span class="pill">Active</span>
  </div>

  <form class="panel-body" [formGroup]="profileFormGroup">
    <div class="form">
      <div class="row">
        <div class="field">
          <label>{{ 'common.firstName' | translate }}</label>
          <input class="input" type="text" formControlName="firstName" />
        </div>
        <div class="field">
          <label>{{ 'common.lastName' | translate }}</label>
          <input class="input" type="text" formControlName="lastName" />
        </div>
      </div>

      <div class="field" *ngIf="showClassField()">
        <label>{{ 'common.currentClass' | translate }}</label>
        <select class="select" formControlName="currentClass">
          <option value="">{{ 'common.currentClass' | translate }}</option>
          <option *ngFor="let class of classList" [value]="class.id">{{ class.name }}</option>
        </select>
      </div>

      <div class="field">
        <label>{{ 'common.email' | translate }}</label>
        <div class="input-wrap has-left">
          <span class="ico-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6" stroke-linecap="round"/></svg>
          </span>
          <input class="input" type="email" formControlName="email" />
        </div>
      </div>

      <div class="field">
        <label>{{ 'common.phone' | translate }}</label>
        <app-phone-input formControlName="phoneNumber" placeholder=""></app-phone-input>
        <span class="field-error" *ngIf="profileFormGroup.get('phoneNumber')?.hasError('invalidPhone')">
          {{ 'common.phoneInvalid' | translate }}
        </span>
      </div>

      <div class="field">
        <label>{{ 'common.school' | translate }}</label>
        <div class="input-wrap has-left">
          <span class="ico-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-5 9 5-9 5-9-5z" stroke-linejoin="round"/><path d="M7 11v4c0 1.6 2.2 3 5 3s5-1.4 5-3v-4" stroke-linecap="round"/></svg>
          </span>
          <input class="input" type="text" formControlName="school" />
        </div>
      </div>

      <div class="count-info" *ngIf="shouldShowCount()">
        <div class="count-display">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke-linecap="round"/><path d="M16 3.13a4 4 0 0 1 0 7.75" stroke-linecap="round"/></svg>
          <div>
            <span class="count-label">{{ getCountLabel() }}</span>
            <span class="count-value">{{ getCountValue() || 0 }}</span>
          </div>
        </div>
      </div>
    </div>
  </form>

  <div class="panel-foot">
    <div class="actions">
      <button class="btn btn-soft" type="button" [disabled]="profileFormGroup.pristine" (click)="onCancelChanges()">{{ 'common.cancel' | translate }}</button>
      <button class="btn btn-primary" type="button" [disabled]="profileFormGroup.pristine || profileFormGroup.invalid" (click)="onSaveChanges()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12l5 5L20 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        {{ 'settings.profile.save' | translate }}
      </button>
    </div>
  </div>
</div>
