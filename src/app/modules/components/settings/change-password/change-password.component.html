<div class="password-change-section">
  <h2>{{ 'settings.changePassword.title' | translate }}</h2>
  <p>{{ 'settings.changePassword.description' | translate }}</p>

  <form [formGroup]="changePasswordFormGroup" class="modern-form">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'settings.changePassword.current' | translate }}</mat-label>
      <input matInput formControlName="currentPassword" [type]="hidePass ? 'password' : 'text'">
      <button mat-icon-button matSuffix (click)="hidePass = !hidePass" [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hidePass">
        <mat-icon>{{ hidePass ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordFormGroup.get('currentPassword')?.hasError('required')">{{ 'common.required' | translate }}
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'settings.changePassword.new' | translate }}</mat-label>
      <input matInput formControlName="newPassword" [type]="hidePass1 ? 'password' : 'text'">
      <mat-icon matSuffix [matTooltip]="'common.passwordTooltip' | translate">info</mat-icon>
      <button mat-icon-button matSuffix (click)="hidePass1 = !hidePass1" [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hidePass1">
        <mat-icon>{{ hidePass1 ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordFormGroup.get('newPassword')?.hasError('required')">{{ 'common.required' | translate }}
      </mat-error>
    </mat-form-field>
  </form>

  <div class="form-actions">
    <button mat-flat-button color="primary" (click)="emitPasswordChange()" [disabled]="!changePasswordFormGroup.valid">
      {{ 'settings.changePassword.submit' | translate }}
    </button>
  </div>
</div>
