<div class="s-page">
  <!-- Page header -->
  <div class="page-head">
    <div>
      <div class="crumb">Account · Settings</div>
      <h1 class="page-title">Llogaria <em>ime</em></h1>
    </div>
  </div>

  <!-- Mobile tab bar (sticky, shown on mobile, hidden on desktop) -->
  <div class="mob-tabs" role="tablist">
    <button class="mob-tab" [class.active]="selectedTab === ProfileTabs.PersonalInfo"
            (click)="selectTab(ProfileTabs.PersonalInfo)">
      <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke-linecap="round"/></svg></span>
      {{ settingsProfile }}
    </button>
    <button class="mob-tab" [class.active]="selectedTab === ProfileTabs.ChangePassword"
            (click)="selectTab(ProfileTabs.ChangePassword)">
      <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3" stroke-linecap="round"/></svg></span>
      {{ settingsChangePassword }}
    </button>
    <button class="mob-tab" [class.active]="selectedTab === ProfileTabs.SubscriptionDashboard"
            (click)="selectTab(ProfileTabs.SubscriptionDashboard)"
            *ngIf="canAccessSubscriptionDashboard$ | async">
      <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4" stroke-linecap="round"/></svg></span>
      {{ settingsSubscription }}
    </button>
    <button class="mob-tab" [class.active]="selectedTab === ProfileTabs.Preferences"
            (click)="selectTab(ProfileTabs.Preferences)">
      <span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      {{ settingsPreferences }}
    </button>
  </div>

  <!-- Account grid: sidebar + panels -->
  <div class="account-grid">

    <!-- Desktop sidebar -->
    <aside class="side">
      <div class="user-card">
        <div class="s-avatar">{{ userInitials$ | async }}</div>
        <div class="who">
          <p class="name">{{ (user$ | async)?.firstName }} {{ (user$ | async)?.lastName }}</p>
          <div class="mail">{{ (user$ | async)?.email }}</div>
        </div>
      </div>

      <nav class="side-nav" role="tablist">
        <button class="side-link" [class.active]="selectedTab === ProfileTabs.PersonalInfo"
                (click)="selectTab(ProfileTabs.PersonalInfo)">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke-linecap="round"/></svg></span>
          {{ settingsProfile }}
        </button>
        <button class="side-link" [class.active]="selectedTab === ProfileTabs.ChangePassword"
                (click)="selectTab(ProfileTabs.ChangePassword)">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3" stroke-linecap="round"/></svg></span>
          {{ settingsChangePassword }}
        </button>
        <button class="side-link" [class.active]="selectedTab === ProfileTabs.SubscriptionDashboard"
                (click)="selectTab(ProfileTabs.SubscriptionDashboard)"
                *ngIf="canAccessSubscriptionDashboard$ | async">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4" stroke-linecap="round"/></svg></span>
          {{ settingsSubscription }}
        </button>
        <button class="side-link" [class.active]="selectedTab === ProfileTabs.Preferences"
                (click)="selectTab(ProfileTabs.Preferences)">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          {{ settingsPreferences }}
        </button>
      </nav>

      <div class="side-foot">
        <div class="stat-mini">
          <div class="lbl">Plan</div>
          <div class="val">Basic <small>· Monthly</small></div>
        </div>
        <div class="stat-mini">
          <div class="lbl">Member</div>
          <div class="val">Brain <small>· Gain</small></div>
        </div>
      </div>
    </aside>

    <!-- Panels wrap -->
    <section class="panels-wrap">

      <div class="tab-pane" [class.active]="selectedTab === ProfileTabs.PersonalInfo">
        <app-profile [profileFormGroup]="profileFormGroup"
                     [userInitials]="(userInitials$ | async)"
                     [fullName]="fullName"
                     [classList]="classesList"
                     [userRole]="userRole"
                     [childrenCount]="childrenCount"
                     [studentsCount]="studentsCount"
                     (saveChanges)="saveProfileData()"
                     (cancelChanges)="onCancelProfile()">
        </app-profile>
      </div>

      <div class="tab-pane" [class.active]="selectedTab === ProfileTabs.ChangePassword">
        <app-change-password [changePasswordFormGroup]="changePasswordFormGroup"
                             (passwordChangeRequest)="onChangePassword($event)">
        </app-change-password>
      </div>

      <div class="tab-pane" [class.active]="selectedTab === ProfileTabs.SubscriptionDashboard">
        <ng-container *ngIf="selectedTab === ProfileTabs.SubscriptionDashboard && (canAccessSubscriptionDashboard$ | async)">
          <app-subscription-dashboard></app-subscription-dashboard>
        </ng-container>
      </div>

      <div class="tab-pane" [class.active]="selectedTab === ProfileTabs.Preferences">
        <app-preferences></app-preferences>
      </div>

    </section>
  </div>
</div>
