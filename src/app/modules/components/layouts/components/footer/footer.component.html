<footer class="footer">
  <div class="footer-content">
    <div class="footer-links">
      <div class="footer-section">
        <h3>{{ 'footer.contact.title' | translate }}</h3>
        <p><i class="fas fa-map-marker-alt"></i> {{ 'footer.contact.address' | translate }}</p>
        <p><i class="fas fa-phone"></i> {{ 'footer.contact.phone' | translate }}</p>
        <p><i class="fas fa-envelope"></i> {{ 'footer.contact.email' | translate }}</p>
      </div>
      <div class="footer-section">
        <h3>{{ 'footer.follow.title' | translate }}</h3>
        <ul class="social-icon">
          <li class="social-icon__item">
            <a class="social-icon__link" href="#" aria-label="Facebook">
              <i class="fab fa-facebook-f"></i>
            </a>
          </li>
          <li class="social-icon__item">
            <a class="social-icon__link" href="#" aria-label="Twitter">
              <i class="fab fa-twitter"></i>
            </a>
          </li>
          <li class="social-icon__item">
            <a class="social-icon__link" href="#" aria-label="LinkedIn">
              <i class="fab fa-linkedin-in"></i>
            </a>
          </li>
          <li class="social-icon__item">
            <a class="social-icon__link" href="#" aria-label="Instagram">
              <i class="fab fa-instagram"></i>
            </a>
          </li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>{{ 'footer.preferences.title' | translate }}</h3>
        <button class="preferences-link" (click)="openPreferences()" aria-label="Open preferences">
          <i class="fas fa-cog"></i> {{ preferencesText }}
        </button>
      </div>
    </div>
    <p class="footer-text">&copy; {{ 'footer.copyright' | translate }}</p>
  </div>
</footer>
