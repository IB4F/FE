<aside class="sidebar" [class.collapsed]="collapsed" [class.dark]="themeService.isDark$ | async"
       (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">

  <!-- Logo -->
  <div class="sidebar-logo">
    @if (collapsed) {
      <div class="logo-icon-sm">BG</div>
    } @else {
      <div class="logo-full">
        <img src="assets/svgImages/bga-logo.svg" class="logo-img" alt="Brain Gain" />
        <span class="logo-sub">Admin Console</span>
      </div>
    }
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">
    @if (!collapsed) {
      <span class="nav-section-label">Menu</span>
    }
    @for (item of navItems; track item.path) {
      <a class="nav-item"
         [routerLink]="item.path"
         routerLinkActive="active"
         [title]="collapsed ? item.label : ''">
        <div class="nav-active-bar"></div>
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path [attr.d]="item.icon"/>
        </svg>
        @if (!collapsed) {
          <span class="nav-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <!-- Spacer -->
  <div class="sidebar-spacer"></div>

  <!-- Theme toggle -->
  <button class="theme-toggle" (click)="themeService.toggle()" [title]="(themeService.isDark$ | async) ? 'Light mode' : 'Dark mode'">
    @if (themeService.isDark$ | async) {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    } @else {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
      </svg>
    }
    @if (!collapsed) {
      <span>{{ (themeService.isDark$ | async) ? 'Light mode' : 'Dark mode' }}</span>
    }
  </button>

<!-- Logout -->
  <button class="logout-btn" (click)="logout()" [title]="collapsed ? 'Dil' : ''">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
    </svg>
    @if (!collapsed) { <span>Dil</span> }
  </button>

  <!-- User -->
  <div class="sidebar-user">
    <div class="user-avatar">{{ userInitials }}</div>
    @if (!collapsed) {
      <div class="user-info">
        <span class="user-name">Admin</span>
        <span class="user-email">{{ userEmail || 'admin@braingain.al' }}</span>
      </div>
    }
  </div>

</aside>
