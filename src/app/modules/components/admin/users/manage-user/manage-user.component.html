<div class="container">
  <div class="title">
    <h1>{{ 'admin.manageUser.title' | translate }}</h1>
  </div>

  <form [formGroup]="userForm" class="form-container">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>{{ 'common.firstName' | translate }}</mat-label>
      <input matInput formControlName="firstName">
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>{{ 'common.lastName' | translate }}</mat-label>
      <input matInput formControlName="lastName">
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>{{ 'common.email' | translate }}</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>{{ 'common.role' | translate }}</mat-label>
      <input matInput formControlName="role">
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>{{ 'common.school' | translate }}</mat-label>
      <input matInput formControlName="school">
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>{{ 'common.city' | translate }}</mat-label>
      <input matInput formControlName="city">
    </mat-form-field>

    <div class="btn-container">
      <button mat-raised-button (click)="goBack()" matTooltipPosition="above" color="warn">
        <mat-icon>arrow_back</mat-icon>
        {{ 'admin.manageUser.back' | translate }}
      </button>
      <button mat-raised-button color="primary" (click)="onUpdate()">
        {{ 'admin.manageUser.update' | translate }}
      </button>
    </div>
  </form>
</div>
