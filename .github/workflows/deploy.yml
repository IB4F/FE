name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production
        run: npx ng build --configuration=production

      - name: Backup current frontend
        env:
          FRONTEND_DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH }}
        run: |
          $ErrorActionPreference = 'Continue'
          $dst = $env:FRONTEND_DEPLOY_PATH
          if (Test-Path $dst) {
            $date = Get-Date -Format "yyyyMMdd_HHmmss"
            $sha = $env:GITHUB_SHA.Substring(0, 8)
            $backupRoot = "C:\Backups\Frontend"
            $backupDir = "$backupRoot\backup_${date}_${sha}"
            New-Item -ItemType Directory -Force -Path $backupDir | Out-Null
            robocopy $dst $backupDir /MIR /XF web.config /R:3 /W:5
            $rc = $LASTEXITCODE
            if ($rc -ge 8) {
              Write-Host "Backup robocopy failed with exit code $rc"
              [Environment]::Exit(1)
            }
            Write-Host "Backup created: $backupDir"
            $backups = Get-ChildItem -Path $backupRoot -Directory | Sort-Object Name
            if ($backups.Count -gt 3) {
              $toDelete = $backups | Select-Object -First ($backups.Count - 3)
              foreach ($old in $toDelete) {
                Remove-Item -Recurse -Force $old.FullName
                Write-Host "Removed old backup: $($old.Name)"
              }
            }
          } else {
            Write-Host "No existing deployment found, skipping backup"
          }
        shell: powershell

      - name: Deploy with Robocopy
        env:
          FRONTEND_DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH }}
        run: |
          $ErrorActionPreference = 'Continue'
          $src = "dist\brain-gain-fe\browser"
          $dst = $env:FRONTEND_DEPLOY_PATH
          Write-Host "Source: $src"
          Write-Host "Destination: $dst"
          robocopy $src $dst /MIR /XF web.config /R:3 /W:5
          $rc = $LASTEXITCODE
          Write-Host "Robocopy exit code: $rc"
          if ($rc -ge 8) {
            Write-Host "Robocopy failed with exit code $rc"
            [Environment]::Exit(1)
          }
          Write-Host "Robocopy completed successfully"
          [Environment]::Exit(0)
        shell: powershell

      - name: Health check
        id: health_check
        run: |
          $url = "https://braingainalbania.al"
          $success = $false
          $maxAttempts = 5
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            $attempt++
            Write-Host "Health check attempt $attempt of $maxAttempts..."
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              if ($response.StatusCode -eq 200) {
                Write-Host "Health check passed - HTTP $($response.StatusCode)"
                $success = $true
                break
              }
              Write-Host "Attempt $attempt - unexpected status: $($response.StatusCode)"
            } catch {
              Write-Host "Attempt $attempt failed: $($_.Exception.Message)"
            }
            if ($attempt -lt $maxAttempts) {
              Write-Host "Waiting 10 seconds before next attempt..."
              Start-Sleep -Seconds 10
            }
          }
          if (-not $success) {
            Write-Host "Health check failed after $maxAttempts attempts"
            exit 1
          }

      - name: Deployment summary
        if: always()
        env:
          HEALTH_CHECK_OUTCOME: ${{ steps.health_check.outcome }}
        run: |
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $status = if ($env:HEALTH_CHECK_OUTCOME -eq "success") { "SUCCESS" } else { "FAILED" }
          Write-Host "========================================"
          Write-Host "   DEPLOYMENT SUMMARY"
          Write-Host "========================================"
          Write-Host "Status    : $status"
          Write-Host "Timestamp : $timestamp"
          Write-Host "Branch    : $env:GITHUB_REF_NAME"
          Write-Host "Commit    : $env:GITHUB_SHA"
          Write-Host "Site      : https://braingainalbania.al"
          Write-Host "========================================"
